name: sync

# Hourly: pull Google Health into a fresh local cache, compute nights, push to
# Supabase. "Fresh" is load-bearing -- see the note below on why this never
# tries to reuse a cache between runs.
#
# The Python side lives in pulse/, a subdirectory of this repo -- Vercel
# deploys the repo root (api/, public/) and ignores this entirely; nothing
# here is served or built by that half. working-directory on every step below
# is what makes that split work: the checkout brings the whole repo, but
# `python -m pulse` only resolves correctly run from inside pulse/.
on:
  schedule:
    - cron: "7 * * * *"     # :07 past the hour, not :00 -- GitHub queues every
                             # repo's on-the-hour jobs together and delays them
  workflow_dispatch: {}      # the "Run workflow" button, for a manual kick --
                             # also how to push a full backfill into Supabase
                             # immediately rather than waiting for the next tick

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pulse

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pulse/requirements.txt

      - run: pip install -r requirements.txt

      # auth.access_token() reads a *file*, .token.json, not an env var -- it
      # was designed for a laptop where `pulse login` writes that file once.
      # A runner has no laptop and no file to reuse: every run checks out a
      # fresh copy of the repo, so this step exists on every single run, not
      # just the first. Only `refresh_token` is required; access_token()
      # refreshes the access token itself from that, using GH_CLIENT_ID /
      # GH_CLIENT_SECRET, and would overwrite this file with a short-lived
      # access_token anyway -- so there's nothing to gain by trying to persist
      # it, and real value in NOT trying (no secret written back to a fork's
      # cache, no stale-token class of bug).
      - name: Write .token.json from the refresh-token secret
        run: |
          python -c "
          import json, os
          json.dump({'refresh_token': os.environ['GH_REFRESH_TOKEN']}, open('.token.json', 'w'))
          "
        env:
          GH_REFRESH_TOKEN: ${{ secrets.GH_REFRESH_TOKEN }}

      # Bare `sync` (no day count): ingest.py's own fallback is "empty cache
      # -> 30 days". Every run's cache IS empty (see above), so every run
      # pulls a fresh 30-day window -- comfortably covers one missed hour or
      # a week of the runner being down, and costs nothing extra: `_pit()`
      # keys drinks by point so an overlapping re-sync is a no-op, and
      # Supabase upserts nights by their `night` primary key. push() always
      # computes and upserts every night currently cached, not just new ones
      # -- so the FIRST run after this workflow exists pushes the full local
      # history in one pass, not just what changed since.
      - run: |
          python -m pulse sync
          python -m pulse push
        env:
          GH_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GH_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          PULSE_TZ: ${{ secrets.PULSE_TZ }}
          # config.py's hrmax (Tanaka: 208 - 0.7*age) feeds strain, zone
          # bounds and every Karvonen threshold -- a runner has no local
          # pulse/.env to read this from, so without it every scheduled run
          # silently used the "23" default regardless of what .env said.
          PULSE_AGE: ${{ secrets.PULSE_AGE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
