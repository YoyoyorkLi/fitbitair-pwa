name: sync

# Hourly: catch Google Health up, compute nights, push the recent ones to
# Supabase.
#
# This used to pull a fresh 30 days every run -- ~30 sequential one-day
# heart-rate requests, ~4 minutes. Nothing is cached between runs on purpose:
# this repo is PUBLIC, and pulse.db is your raw HR/sleep history -- a cache a
# fork PR could restore and read is not worth the minutes it saves. Instead
# `pulse push sync` (== ingest.sync() catch-up + push):
#   - pulls only ~5 days of heart-rate (a finished day never changes, and HR is
#     the only heavy type -- ~17k points/day)
#   - pulls a full ~35-day baseline window of the cheap daily/sleep/steps types
#     so push() can still compute a 30-day trailing median
#   - runs every request concurrently
#   - build_rows() keys off the heart-rate days, so only those ~5 nights reach
#     Supabase -- the older rows are already correct and Google never revises a
#     finished day
#
# The Python side lives in pulse/, a subdirectory of this repo -- Vercel
# deploys the repo root (api/, public/) and ignores this entirely. The
# working-directory below is what makes that split work: the checkout brings
# the whole repo, but `python -m pulse` only resolves correctly from inside
# pulse/.
on:
  schedule:
    # Four odd-minute slots an hour. GitHub heavily deprioritises scheduled
    # runs on a low-traffic repo -- with a single hourly cron the real gap was
    # 3-6 hours -- so ask often and at off-peak minutes and hope one lands per
    # hour. A run is ~25s and this repo is public (unlimited Actions minutes),
    # so the extra attempts cost nothing. For a hard guarantee, drive it from
    # an external pinger against /api/sync instead (see api/sync.js).
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Re-pull 60 days and re-push every night (metrics.py change / repair)"
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pulse

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # uv installs numpy + pandas in ~1s from its hard-linked cache; plain
      # `pip install` was ~9s of unpacking every run.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pulse/requirements.txt

      - run: uv pip install --system -r requirements.txt

      # auth.access_token() reads a *file*, .token.json, not an env var -- it
      # was designed for a laptop where `pulse login` writes that file once.
      # Only `refresh_token` is required; access_token() refreshes the access
      # token from it via GH_CLIENT_ID / GH_CLIENT_SECRET, and would overwrite
      # this file with a short-lived access_token anyway -- so it is written
      # fresh every run and never persisted.
      - name: Write .token.json from the refresh-token secret
        run: |
          python -c "
          import json, os
          json.dump({'refresh_token': os.environ['GH_REFRESH_TOKEN']}, open('.token.json', 'w'))
          "
        env:
          GH_REFRESH_TOKEN: ${{ secrets.GH_REFRESH_TOKEN }}

      # Normal run: `push sync` == catch-up ingest.sync() + push, no HTML build.
      # full=true instead: `push 60` re-pulls 60 days of everything (including
      # heart-rate, one request per day) and re-pushes every night. Anything
      # deeper is a local `python -m pulse push <N>`.
      - run: python -m pulse ${{ (github.event_name == 'workflow_dispatch' && inputs.full) && 'push 60' || 'push sync' }}
        env:
          GH_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GH_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          PULSE_TZ: ${{ secrets.PULSE_TZ }}
          # config.py's hrmax (Tanaka: 208 - 0.7*age) feeds strain, zone
          # bounds and every Karvonen threshold -- a runner has no local
          # pulse/.env to read this from, so without it every scheduled run
          # silently used the "23" default regardless of what .env said.
          PULSE_AGE: ${{ secrets.PULSE_AGE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
