<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="google-site-verification" content="oOu-u5TaZQzA4YoMPktXOjSwHKnXndLQO70vPKNvDr0" />
<title>Pulse</title>
<meta name="theme-color" content="#0B0E14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pulse">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<!-- Password, not magic link: a magic link opens in Safari and sets the session
     in Safari's storage, a different partition from this home-screen app. -->
<section id="signin" class="screen" hidden>
  <h1>Pulse</h1>
  <form id="signin-form" class="stack">
    <label class="field"><span>Email</span>
      <input type="email" name="email" autocomplete="username" required inputmode="email"></label>
    <label class="field"><span>Password</span>
      <input type="password" name="password" autocomplete="current-password" required></label>
    <button type="submit" class="primary">Sign in</button>
    <p id="signin-error" class="error" role="alert" hidden></p>
  </form>
  <p class="hint">Or open <a href="?demo=1">the demo</a> to see the dashboard with synthetic data.</p>
</section>

<section id="dash" class="screen" hidden>
  <!-- The night selector. Every panel on the Day and Sleep tabs is scoped to
       one night, so the date is a control, not a caption. Tapping the date
       itself jumps back to the newest night. -->
  <div class="top">
    <div class="daynav" id="daynav">
      <button class="nav" id="day-prev" type="button" aria-label="Previous night">‹</button>
      <button class="stamp" id="stamp" type="button"></button>
      <button class="nav" id="day-next" type="button" aria-label="Next night">›</button>
      <!-- Jump to any loaded night from a month grid instead of stepping ‹ ›
           one at a time. A button of its own rather than the date stamp: the
           stamp already means "back to the latest night" and, five taps deep,
           the debug overlay. -->
      <button class="nav cal" id="cal-btn" type="button" aria-label="Pick a night" title="Pick a night">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      </button>
      <!-- Hidden on the demo, and until a live session exists: without one
           /api/sync has nothing to authenticate and would only ever 401. -->
      <button class="nav sync" id="sync-btn" type="button" aria-label="Sync now" title="Sync now" hidden><span>⟳</span></button>
    </div>
  </div>

  <!-- Sticks to the top of the viewport whenever you are NOT on the newest
       night. The date lives in the header, the header scrolls away, and every
       tile below it silently changes meaning -- without this there is nothing
       on screen telling you a full 24h curve is yesterday's rather than a
       clock that has run fast. Absent entirely on the latest night, so it
       costs no space in the normal case. -->
  <button class="pastbar" id="pastbar" type="button" hidden></button>

  <div class="banner" id="demo-banner" hidden>
    <b>Synthetic data</b> — from <code>pulse demo</code>, with the documented alcohol effect on HRV,
    REM and resting HR simulated on nights that have drinks. Shows the shape, not your numbers.
  </div>

  <div id="today"></div>
  <div id="workouts" hidden></div>
  <div id="drinks" hidden></div>
  <div id="trends" hidden></div>

  <!-- Drill-down for one of the three Day-tab dials. Lives inside #dash,
       layered on top of it, rather than as a fourth tab -- closing it has to
       restore exactly the day and tab you left, and nesting it here means
       every scrub/tip listener already bound to #dash reaches it for free. -->
  <div id="detail" class="detail" hidden>
    <div class="detail-head">
      <button id="detail-close" class="nav" type="button" aria-label="Back">‹</button>
      <h1 id="detail-title"></h1>
    </div>
    <div id="detail-body"></div>
  </div>

  <!-- One day's workouts: opened from a marked day on the Workouts calendar,
       or from a workout row on the Strain detail -- same screen either way,
       so "click on the workout" means the same thing everywhere it appears.
       Stacks visually on top of #detail (higher z-index in styles.css) rather
       than closing it first, since the Strain-detail entry point opens this
       from inside that overlay and closing it should come back to the Strain
       detail, not all the way out to the Day tab. -->
  <div id="workout-day" class="detail" hidden>
    <div class="detail-head">
      <button id="workout-day-close" class="nav" type="button" aria-label="Back">‹</button>
      <h1 id="workout-day-title"></h1>
    </div>
    <div id="workout-day-body"></div>
  </div>

  <!-- One night's drinks: opened from a marked day on the Drinks calendar.
       Same overlay pattern as #workout-day -- add/delete write straight to
       the drinks table (like the never-built "Fix-up screen" schema.sql
       already provisioned RLS for), then re-render from the refreshed data. -->
  <div id="drinks-day" class="detail" hidden>
    <div class="detail-head">
      <button id="drinks-day-close" class="nav" type="button" aria-label="Back">‹</button>
      <h1 id="drinks-day-title"></h1>
    </div>
    <div id="drinks-day-body"></div>
  </div>

  <!-- The Day tab's night picker: a month grid opened from the header's
       calendar button. Same overlay pattern as the three above, so Escape and
       the edge-swipe close it through topOverlay() like they close those. -->
  <div id="day-picker" class="detail picker" hidden>
    <div class="detail-head">
      <button id="day-picker-close" class="nav" type="button" aria-label="Back">‹</button>
      <h1>Pick a night</h1>
    </div>
    <div id="day-picker-body"></div>
  </div>

  <!-- The four tabs, pinned to the bottom edge where a thumb already is. Fixed,
       so where it sits in the DOM is only about reading order; z-index keeps it
       under every .detail overlay, which cover it the way a pushed screen would. -->
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button class="tab" role="tab" aria-selected="true"  data-tab="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>
      <span>Day</span></button>
    <button class="tab" role="tab" aria-selected="false" data-tab="workouts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg>
      <span>Workouts</span></button>
    <button class="tab" role="tab" aria-selected="false" data-tab="drinks">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 8.5V7a2.2 2.2 0 0 1 2.2-2.2 2.6 2.6 0 0 1 4.8-.5A2.2 2.2 0 0 1 14.5 6.5v2"/><path d="M4.5 8.5h10V19a1.5 1.5 0 0 1-1.5 1.5H6A1.5 1.5 0 0 1 4.5 19V8.5z"/><path d="M14.5 11h2.2a2.3 2.3 0 0 1 2.3 2.3v2.4a2.3 2.3 0 0 1-2.3 2.3h-2.2"/><path d="M8 12.5v4.5M11 12.5v4.5"/></svg>
      <span>Drinks</span></button>
    <button class="tab" role="tab" aria-selected="false" data-tab="trends">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v16h16"/><path d="M8 15l4-4 3 3 5-6"/></svg>
      <span>Trends</span></button>
  </nav>
</section>

<section id="loading" class="screen">
  <p class="hint">Loading…</p>
</section>

<script type="module" src="/app.js"></script>
</body>
</html>
